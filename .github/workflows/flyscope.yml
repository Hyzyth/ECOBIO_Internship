name: FlyScope Python 3.10.7

on:
  pull_request:
    paths:
      - "CCRT/logiciel-v2_2/**"
      - ".github/workflows/flyscope.yml"
  push:
    branches: [main]
    paths:
      - "CCRT/logiciel-v2_2/**"
      - ".github/workflows/flyscope.yml"
  workflow_dispatch:

jobs:
  deployment-runtime:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: CCRT/logiciel-v2_2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.7"
          cache: pip
          cache-dependency-path: |
            CCRT/logiciel-v2_2/requirements.txt
            CCRT/logiciel-v2_2/requirements-models.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check exact deployment version
        run: python -c 'import sys; assert sys.version_info[:3] == (3, 10, 7), sys.version'
      - name: Install UI and actual model dependencies
        run: python -m pip install -r requirements-models.txt
      - name: Validate dependencies and Python tests including original models
        run: |
          python -m pip check
          python -m unittest discover -s tests -v
      - name: Validate JavaScript review and dataset contracts
        run: node --test tests/*.test.js
