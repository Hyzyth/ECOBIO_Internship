name: FlyScope unified runtime

on:
  pull_request:
    paths:
      - "CCRT/logiciel-v2_2/**"
      - ".github/workflows/flyscope.yml"
  push:
    branches: [main]
    paths:
      - "CCRT/logiciel-v2_2/**"
      - ".github/workflows/flyscope.yml"
  workflow_dispatch:

concurrency:
  group: flyscope-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unified-runtime:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: CCRT/logiciel-v2_2
    env:
      KERAS_BACKEND: torch
      MPLCONFIGDIR: ${{ runner.temp }}/flyscope-mpl
      FLYSCOPE_CACHE_DIR: ${{ runner.temp }}/flyscope-model-code
      TORCH_HOME: ${{ runner.temp }}/flyscope-torch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install native image libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0
      - name: Install the one requirements file (CPU wheels on the GPU-less runner)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip check
          python tools/check_runtime.py --prepare-models
      - name: Validate app, models and shared dataset contracts
        run: |
          python -m unittest discover -s tests -v
          python -m unittest tests.suite_contracts -v
          node --test tests/*.test.js
      - name: Download the creator's anatomical labels
        run: |
          mkdir -p "$RUNNER_TEMP/pose-data"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/pose-data/dataset.zip" https://github.com/talmolab/sleap-datasets/releases/download/dm-courtship-v1/drosophila-melanogaster-courtship.zip
          unzip -q "$RUNNER_TEMP/pose-data/dataset.zip" -d "$RUNNER_TEMP/pose-data"
      - name: Actually train and reload all model families in the same environment
        run: |
          set +e
          bash -e -c '
            python tools/sleap_pose.py train --labels "$RUNNER_TEMP/pose-data/drosophila-melanogaster-courtship/courtship_labels.slp" --output "$RUNNER_TEMP/pose-smoke" --epochs 1 --max-examples 8 --size 64 --filters 8 --batch-size 2 --device cpu
            python tools/sleap_pose.py train --labels "$RUNNER_TEMP/pose-data/drosophila-melanogaster-courtship/courtship_labels.slp" --parent "$RUNNER_TEMP/pose-smoke" --output "$RUNNER_TEMP/pose-finetune-smoke" --epochs 1 --max-examples 8 --batch-size 2 --device cpu
            python tools/validate_model_suite.py --pose-model "$RUNNER_TEMP/pose-smoke" --output "$RUNNER_TEMP/suite-smoke"
          ' > "$RUNNER_TEMP/suite-training.log" 2>&1
          suite_result=$?
          set -e
          cat "$RUNNER_TEMP/suite-training.log"
          if [ "$suite_result" -ne 0 ]; then
            python - "$RUNNER_TEMP/suite-training.log" <<'LOG'
          from pathlib import Path
          import sys
          detail = '\n'.join(Path(sys.argv[1]).read_text(errors='replace').splitlines()[-40:])
          print('::error::' + detail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          LOG
          fi
          exit "$suite_result"
      - name: Install browser development tools
        run: |
          npm install --prefix "$RUNNER_TEMP/flyscope-browser" playwright@1.63.0
          node "$RUNNER_TEMP/flyscope-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check annotation, exports, all trainers and registered-weight inference
        env:
          NODE_PATH: ${{ runner.temp }}/flyscope-browser/node_modules
          PYTHON: python
          SUITE_SMOKE_DIR: ${{ runner.temp }}/suite-smoke
          FLYSCOPE_SUITE_MODELS_DIR: ${{ runner.temp }}/suite-smoke/results
          RUN_MODEL_TRAINING: "1"
        run: |
          export CHROMIUM_PATH="$(node -p 'require("playwright").chromium.executablePath()')"
          python app.py > "$RUNNER_TEMP/flyscope-server.log" 2>&1 &
          flyscope_pid=$!
          trap 'kill "$flyscope_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:5000/api/models; then break; fi
            sleep 1
          done
          curl --fail --silent --output /dev/null http://127.0.0.1:5000/api/models
          node tests/workflow-browser.cjs
          node tests/studies-browser.cjs
          node tests/experiments-browser.cjs
          node tests/model-suite-browser.cjs
